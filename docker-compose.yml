# docker-compose.yml — deploy no Dokploy (ou em qualquer Docker)
#
# Dokploy: Applications -> Create Application -> tipo "Docker Compose" ->
# aponte para este repositório -> defina o domínio -> Deploy.
#
# Todas as variáveis abaixo aparecem no painel Environment do Dokploy.
# O valor depois de ":-" é o padrão usado quando a variável não é definida.

services:
  grabber:
    build:
      context: .
      dockerfile: Dockerfile
    image: grabber-aula:latest
    container_name: grabber-aula
    restart: unless-stopped

    # Dokploy/Traefik fala com o container nesta porta.
    # Se o seu proxy já publica a porta, pode remover este bloco.
    # A variável PORTA vale para os três lugares (mapeamento, app e healthcheck).
    ports:
      - "${PORTA:-8000}:${PORTA:-8000}"

    environment:
      # ---------- servidor ----------
      PORTA: "${PORTA:-8000}"
      HOST: "0.0.0.0"
      ARQ_LOG: "/dados/capturas.jsonl"
      # HTML da fachada. Dentro da imagem ele está em /app/mascara.html.
      # Declarado aqui para não existir variável "escondida" no código.
      MASCARA: "${MASCARA:-/app/mascara.html}"

      # ---------- painel e comportamento ----------
      # Senha do /painel. Sem isso, o token é sorteado a cada boot e o link
      # do painel muda a cada deploy (o valor sai no log do container).
      TOKEN_PAINEL: "${TOKEN_PAINEL:-}"
      # Domínio público; só aparece no log de inicialização.
      URL_PUBLICA: "${URL_PUBLICA:-}"
      # 1 = mantém o selo "demonstração de aula" na fachada (padrão)
      # 0 = remove o selo (só no momento da demonstração em sala)
      DIVULGAR: "${DIVULGAR:-1}"
      # URL para onde a rota /r redireciona depois de capturar (opcional)
      DESTINO: "${DESTINO:-}"

      # ---------- fachada: empresa ----------
      EMPRESA_NOME: "${EMPRESA_NOME:-Aurora Serviços}"
      EMPRESA_RAMO: "${EMPRESA_RAMO:-Assessoria contábil e empresarial}"
      EMPRESA_BIO: "${EMPRESA_BIO:-Canais oficiais de atendimento da matriz.}"
      EMPRESA_CNPJ: "${EMPRESA_CNPJ:-00.000.000/0001-00}"
      EMPRESA_ENDERECO: "${EMPRESA_ENDERECO:-Av. das Acácias, 1200 — Centro}"
      EMPRESA_HORARIO: "${EMPRESA_HORARIO:-Segunda a sexta, das 8h às 17h}"

      # ---------- fachada: contato 1 (botão em destaque) ----------
      CONTATO1_NOME: "${CONTATO1_NOME:-Kelly Moreira}"
      CONTATO1_CARGO: "${CONTATO1_CARGO:-Secretaria}"
      CONTATO1_NUMERO: "${CONTATO1_NUMERO:-(11) 0000-0000}"

      # ---------- fachada: contato 2 ----------
      CONTATO2_NOME: "${CONTATO2_NOME:-Recursos Humanos}"
      CONTATO2_CARGO: "${CONTATO2_CARGO:-RH}"
      CONTATO2_NUMERO: "${CONTATO2_NUMERO:-(11) 0000-0001}"

      # ---------- fachada: contato 3 ----------
      CONTATO3_NOME: "${CONTATO3_NOME:-Contábil}"
      CONTATO3_CARGO: "${CONTATO3_CARGO:-Financeiro}"
      CONTATO3_NUMERO: "${CONTATO3_NUMERO:-(11) 0000-0002}"

    volumes:
      # O log precisa sobreviver a deploy/restart. Sem volume, cada deploy
      # apagaria as capturas da aula no meio do exercício.
      - dados:/dados

    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:${PORTA:-8000}/health', timeout=2).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

    # Trava o consumo: é um servidor de aula, não um serviço de produção.
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dados:
